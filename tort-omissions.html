      justify-content: center;
      padding: 15px 20px;

      background: var(--navy);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;

      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;

      margin-left: 12px;
      color: var(--gold-light);
      font-size: 15px;
    }

    .resource-action:hover,

      color: #fff;
      background: var(--navy-soft);
      outline: none;

    .resource-actions {

      .resource-action { grid-column: 1; }
      .resource-actions { grid-column: 1; flex-direction: column; }

    .resource-action, .resource-actions .resource-action { width: 230px; min-width: 230px; font-size: .875rem; letter-spacing: .08em; }
