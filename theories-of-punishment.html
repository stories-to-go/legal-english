<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Legal English materials on theories of punishment.">
  <title>Theories of Punishment | Legal English</title>
  <style>
    :root {
      --navy: #0d1b2a;
      --navy-soft: #16283a;
      --ink: #20252b;
      --muted: #69717a;
      --gold: #b9924f;
      --gold-light: #d8bd83;
      --ivory: #f2f4f5;
      --line: #d5d9dc;
      --shadow: 0 22px 55px rgba(13, 27, 42, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--ivory);
      font-family: Arial, Helvetica, sans-serif;
    }

    a { color: inherit; }

    .topbar {
      border-bottom: 1px solid rgba(216, 189, 131, 0.24);
      color: rgba(255, 255, 255, 0.78);
      background: var(--navy);
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 48px));
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin: 0 auto;
    }

    .brand {
      color: var(--gold-light);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .back-link {
      color: rgba(255, 255, 255, 0.66);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link::before {
      content: "←";
      margin-right: 10px;
      color: var(--gold-light);
      font-size: 16px;
    }

    .back-link:hover,
    .back-link:focus-visible { color: #fff; outline: none; }

    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #0d1b2a 0%, #14283b 100%);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 78px 0 82px;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(48px, 7vw, 78px);
      line-height: 1.04;
      letter-spacing: -0.025em;
    }

    .gold-rule {
      width: 88px;
      height: 2px;
      margin: 28px 0 0;
      background: var(--gold);
    }

    main {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 92px;
    }

    .section-head {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .section-head h2 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(34px, 4.5vw, 50px);
      line-height: 1.12;
    }

    .resources {
      border-bottom: 1px solid var(--line);
    }

    .resource {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
      min-height: 150px;
      padding: 28px 0;
      border-top: 1px solid var(--line);
    }

    .resources .resource:first-child { border-top: 0; }

    .resource-number {
      align-self: start;
      padding-top: 8px;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
    }

    .resource h3 {
      margin: 0;
      color: var(--navy);
      font-size: 29px;
      line-height: 1.2;
    }

    .resource-action {
      width: 190px;
      min-width: 190px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      border: 1px solid var(--navy);
      color: #fff;
      background: var(--navy);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .resource-action::after {
      content: "→";
      margin-left: 12px;
      color: var(--gold-light);
      font-size: 15px;
    }

    .resource-action:hover,
    .resource-action:focus-visible {
      transform: translateY(-2px);
      color: #fff;
      background: var(--navy-soft);
      outline: none;
    }

    .resource-action:hover::after,
    .resource-action:focus-visible::after { color: var(--gold-light); }

    .resource-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .resource-actions .resource-action {
      width: 190px;
      min-width: 190px;
    }

    @media (max-width: 760px) {
      .topbar-inner,
      .hero-inner,
      main { width: min(100% - 32px, 1120px); }
      .topbar-inner { min-height: 62px; }
      .hero-inner { padding: 66px 0 72px; }
      .resource { grid-template-columns: 46px minmax(0, 1fr); gap: 14px; }
      .resource-action { grid-column: 2; width: 100%; min-width: 0; margin-top: 8px; }
      .resource-actions { grid-column: 2; width: 100%; }
      .resource-actions .resource-action { width: 100%; min-width: 0; }
    }

    @media (max-width: 460px) {
      .brand { font-size: 16px; }
      .back-link { font-size: 10px; }
      .resource { grid-template-columns: 1fr; }
      .resource-number { padding-top: 0; }
      .resource-action { grid-column: 1; }
      .resource-actions { grid-column: 1; flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav class="topbar" aria-label="Primary navigation">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Legal English</a>
      <a class="back-link" href="index.html#legal-areas">Criminal Law</a>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Criminal Law</p>
      <h1>Theories of Punishment</h1>
      <div class="gold-rule" aria-hidden="true"></div>
    </div>
  </header>

  <main>
    <header class="section-head">
      <h2>Study Materials</h2>
    </header>

    <section class="resources" aria-label="Study resources">
      <article class="resource">
        <span class="resource-number">01</span>
        <div>
          <h3>English PDF</h3>
        </div>
        <a class="resource-action" href="Theories_of_Punishment_Study_Guide.pdf" download>Download PDF</a>
      </article>

      <article class="resource">
        <span class="resource-number">02</span>
        <div>
          <h3>Chinese PDF</h3>
        </div>
        <a class="resource-action" href="Theories_of_Punishment_Chinese_Study_Guide.pdf" download>Download PDF</a>
      </article>

      <article class="resource">
        <span class="resource-number">03</span>
        <div>
          <h3>Video</h3>
        </div>
        <div class="resource-actions">
          <a class="resource-action" href="https://www.bilibili.com/video/BV18Weh6oEGo/?spm_id_from=333.1387.upload.video_card.click&amp;vd_source=38b42b6c9cd2d2d8ab9256c9c228cb35" target="_blank" rel="noopener">Open Bilibili</a>
          <a class="resource-action" href="https://www.youtube.com/watch?v=eaDpjc0gRA8&amp;t=145s" target="_blank" rel="noopener">Open YouTube</a>
        </div>
      </article>
    </section>

  </main>
</body>
</html>
